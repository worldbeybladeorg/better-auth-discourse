name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'worldbeybladeorg/better-auth-discourse'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate release version and select npm dist-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}, matching package.json`);
          }
          const prerelease = version.includes('-');
          if (prerelease !== (process.env.RELEASE_PRERELEASE === 'true')) {
            throw new Error('GitHub prerelease status must match the package version');
          }
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${prerelease ? 'next' : 'latest'}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir examples/vite-nitro typecheck
      - run: pnpm --dir examples/vite-nitro test
      - run: pnpm validate:package
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11
      - name: Publish with OIDC and provenance
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
